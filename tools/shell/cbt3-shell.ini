[shell]
; Exact /version/client/ paths routed by the existing native request hooks:
; Legacy: patchV1, getCdnV1, preDownloadConfV1, getAccountV1, cdntoken.
; OBT v1_0: patch, getcdn, predownloadconf, getaccount.
; CDN assets, SDK URLs and requests outside these hooks stay original.
api_url=http://127.0.0.1:20001
; Empty disables the configured upload endpoint. No token/request body logging.
log_url=
; LurukaPS exposes plain TCP; disable client KCP/TLS getters.
tcp_only=1
; Optional camera fade behavior; on by default.
disable_camera_fade=1
; Optional prefilled local account. The native dialog is shown on each launch.
open_id=
